[project]
name = "crypto-lab"
version = "1.0.0"
description = "secp256k1, ECDSA, HD wallets and post-quantum cost (OE Blockchain Lab 02, student implementation)"
readme = "README.md"
requires-python = ">=3.11"
# pycryptodome is used for Keccak-256 only; everything else is standard library.
dependencies = ["pycryptodome>=3.20"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
